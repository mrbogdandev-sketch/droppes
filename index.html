<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f6">
  <title>FILEDROP — конвертер файлов</title>
  <link rel="stylesheet" href="styles.css">
  <script src="lame.min.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar"><a class="wordmark" href="#" aria-label="Filedrop"><img src="logo.svg" alt="FILEDROP"></a></header>
    <section class="intro"><h1>Каждому файлу —<br><span>свой формат.</span></h1></section>
    <section class="dropzone" id="dropzone" tabindex="0" aria-label="Перетащите файлы или выберите на устройстве">
      <div class="drop-inner"><div class="upload-icon" aria-hidden="true"><img src="filestodrop.svg" alt=""></div><h2>Перетащите файлы сюда</h2><p>или <button class="text-button" id="browse">выберите на устройстве</button></p></div>
      <input id="fileInput" type="file" multiple hidden>
    </section>
    <section class="files-section" id="filesSection" hidden><div class="section-heading"><h2>Ваши файлы <span id="fileCount"></span></h2><button class="clear-button" id="clearAll">Очистить</button></div><div id="fileList" class="file-list"></div><div class="footer-note"><span id="status">Готово к конвертации</span><button class="convert-button" id="convertAll">Конвертировать <span aria-hidden="true">↗</span></button></div></section>
    <footer class="bottom"><span>Файлы не покидают ваше устройство</span></footer>
  </main>
  <svg class="filter-defs" aria-hidden="true" width="0" height="0"><filter id="rippleDisplacement" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
